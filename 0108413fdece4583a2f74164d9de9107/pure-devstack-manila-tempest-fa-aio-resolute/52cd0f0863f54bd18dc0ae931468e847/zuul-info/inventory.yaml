      change: '1012430'
      change_message: "Fix security service pagination for admins\n\nThe listing APIs
        allow non-admin callers, but query filtering differs\nbased on `context.is_admin`.
        `remove_invalid_options()` strips unknown\nsearch options for non-admin contexts
        while retaining them for admins.\nAs a result, admin requests treat `limit`
        and `offset` as resource filters\nand return empty lists. Non-admin requests
        already apply pagination.\n\nRemove both parameters from the local filters
        while retaining them in\nthe request for validation and slicing by `common.limited()`.\n\nAdd
        regression tests for both endpoints and admin/non-admin contexts,\nincluding
        filtering, alternate listing paths, empty results, and invalid\npagination
        values. Policy checks are mocked; these tests verify filtering\nand pagination,
        not role authorization. Document the pagination parameters\nand add a release
        note.\n\nAssisted-By: gpt-6.1-sol\nChange-Id: Ia2863ec55419fb304cda3172a004d04bdca88b79\nSigned-off-by:
        Martin Andr\xE9 <m.andre@redhat.com>\n"
