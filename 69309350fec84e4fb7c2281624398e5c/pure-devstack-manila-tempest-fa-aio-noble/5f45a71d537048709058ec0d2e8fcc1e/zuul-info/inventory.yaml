      change: '999135'
      change_message: "container driver: add share server replica support\n\ncreate_share_server_replica\n
        \ Creates a new container for the replica share server.  Network setup\n  and
        security service configuration mirror _setup_server.  Because the\n  driver
        uses LVM on the bare-metal host, all LVM volumes are physically\n  present
        on the same host; the replica container therefore mounts each\n  existing
        share LV via _mount_lv_in_container so it can serve the same\n  data immediately
        without any block-level replication. Mount failures\n  are logged as warnings
        and do not abort the creation. Returns\n  {'replica_state': REPLICA_STATE_IN_SYNC}.\n\n_mount_lv_in_container
        (helper)\n  Mounts an existing LV into a container by creating the mount-point\n
        \ directory and running 'mount' inside the container.  Unlike\n  _mount_storage
        it does not create a new CIFS export, which is correct\n  for replica containers
        that re-use the export of the active server.\n\ndelete_share_server_replica\n
        \ Tears down the replica container in the same way _teardown_server does\n
        \ for a regular share server: removes OVS ports, disconnects and removes\n
        \ Docker networks, then stops the container.\n\npromote_share_server_replica\n
        \ Promotes a replica container to active.  Because shares are already\n  mounted
        at replica-creation time no data movement is needed.  The\n  method remounts
        any shares provided in share_server_resources (safety\n  net for shares created
        after the replica) and returns the updated\n  replica_state list together
        with an empty share_pool_mappings dict.\n\nupdate_share_server_replica_state\n
        \ Checks whether the replica container is still running and returns\n  REPLICA_STATE_IN_SYNC
        or REPLICA_STATE_OUT_OF_SYNC accordingly.\n\nDepends-On: https://review.opendev.org/c/openstack/manila-tempest-plugin/+/998360\nChange-Id:
        Ic4c7a5ed180a5943b2e7fad626ab3b2090ba2cc5\nSigned-off-by: Kiran Pawar <kinpaa@gmail.com>\nAssisted-By:
        Claude\n"
