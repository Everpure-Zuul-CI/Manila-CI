      buildset: 5f04bda0222248d6a53add678d9cbc53
      change: '1014589'
      change_message: 'Extend generic driver shares online


        extend_share() used to disconnect all clients, unmount the

        filesystem, detach the volume from the service instance, extend it

        in Cinder, reattach, remount, and restore client access. None of

        that disruption is required to grow a share: Cinder can extend an

        attached volume in place, and resize2fs grows a mounted ext

        filesystem.


        Keep the volume attached and extend it in place, then resize the

        mounted filesystem. fsck cannot run against a mounted filesystem,

        so it is skipped on the online path.


        This requires Cinder Wallaby or newer: extending an attached volume

        routes to the in-place path only for API microversion 3.42 or

        later, which manila''s cinderclient negotiates automatically. The

        volume backend must support online extension, and Nova must handle

        the volume-extended server event.


        Change-Id: I9bc61216bdaf6bea859507399fcb1d1ac345a219

        Partially-implements: bp generic-driver-nondisruptive-resize

        Signed-off-by: Goutham Pacha Ravi <gouthampravi@gmail.com>

        '
