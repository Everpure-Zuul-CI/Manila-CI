      change: '1015695'
      change_message: 'Add SMB protocol helper to the CephFS driver


        Serve CIFS shares through a Ceph-managed Samba cluster (the

        ceph-mgr smb module), selected with cephfs_protocol_helper_type =

        SMB and cephfs_smb_cluster_id.


        Shares remain CephFS subvolumes; the ceph.smb.share resource is

        created when the first user access rule is granted and removed

        with the last one, so shares are deny-by-default. Access rules

        (access_type ''user'') are enforced with NTFS ACLs on the subvolume

        root -- an allow-list written as the user.NTACL xattr through

        oslo.privsep. Standalone users are managed by Manila, and their

        generated passwords surface through the access rule''s access_key,

        like cephx keys in the native mode. Share lifecycle, snapshots and

        create-from-snapshot are unchanged.


        Signed-off-by: Goutham Pacha Ravi <gouthampravi@gmail.com>

        Assisted-By: pi zai/glm-5.3

        Change-Id: I38dd5e0d78fa4c1ae029bf9f57decc246981fa2d

        Signed-off-by: Goutham Pacha Ravi <gouthampravi@gmail.com>

        '
