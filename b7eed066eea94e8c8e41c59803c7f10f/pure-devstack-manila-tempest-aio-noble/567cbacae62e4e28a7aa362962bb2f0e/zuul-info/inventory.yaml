      change: '1014450'
      change_message: 'scheduler: propagate goodness/filter function to pools from
        conf


        Drivers that do not declare goodness_function or filter_function

        inside their pool data structures (e.g. CephFS) had these values

        silently ignored by the scheduler weigher, which always fell back

        to a goodness rating of 0.


        The fix reads goodness_function and filter_function from the

        backend-level capability report (which already carries the values

        from manila.conf) in update_backend(), and propagates them to each

        pool via _merge_pool_capabilities() when the pool does not already

        declare its own value.


        Closes-Bug: #2074114

        Change-Id: Idac1e34e6a569550cc691dc16ea34148b7cb0390

        Signed-off-by: sakumbha <sakumbha@redhat.com>

        (cherry picked from commit 7ba14f1305f02880b32bba18b78a9a9921b13604)

        (cherry picked from commit 831d80d927fcb767bf5a213a133cf348b0fe288d)

        (cherry picked from commit eef02d91404054d7eff2577380415c6c3f7cff4d)

        '
