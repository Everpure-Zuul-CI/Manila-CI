      branch: master
      build: e7095d8685814584b821df35f6b6a00b
      buildset: 420fc9b169bf44d5b2a08ddb37d6205e
      change: '1010881'
      change_message: '[cephfs] Support specifying user key cipher.


        This is related to OSSN-0108 [1], where mitigation requires using ceph

        keys of new format, with new ciphers.

        However client support for such keys is still lagging,

        the kernel krbd module that supports aes256 ceph keys is only available

        in kernels 7.0 and newer,

        and appropriate version of librados is not yet packaged and available

        from official repos for many even fresh distros (like e.g. Ubuntu 26.04).


        In order to support existing older clients while still operating Ceph

        where default key cipher is already aes256, Manila must create access

        users for cephfs with controllable key cipher.

        This is adds a new config option `cephfs_key_cipher` (default is not to pass

        any explicit cipher, and thus use cluster default as configured in Ceph).


        Unfortunalety though, ceph CLI does not allow to provide a key type

        for the user that will be created as part of `cepf fs subvolume

        authorize` command (the same as to `ceph auth add` or `ceph fs authorize`).

        This is why we are resorting to creating and deleting that user explicitly.

        In order to ensure the user unuqueness, we do that under a global

        distributed lock.


        [1] https://docs.openstack.org/security-notes/OSSN-0108.html


        Change-Id: Ia63b90a6cf176e0b235802ffd8e94f3ea629caca

        Signed-off-by: Pavlo Shchelokovskyy <shchelokovskyy@gmail.com>

        '
