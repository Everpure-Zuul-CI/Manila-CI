        before this driver can be used.


        Minimum Purity//FA 6.10.6 and FA REST 2.54.


        Initial iteration of this driver supports IPv4 and IPv6,

        with NFS v3 and v4.1


        SSL certificate verification of the FlashArray management connection is

        enabled by default and is configurable via the flasharray_ssl_cert_verify

        and flasharray_ca_cert_path options.


