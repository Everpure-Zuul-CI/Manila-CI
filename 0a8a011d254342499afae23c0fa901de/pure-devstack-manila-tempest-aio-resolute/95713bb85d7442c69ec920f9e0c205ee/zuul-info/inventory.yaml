      change_message: "Validate remove security service action body\n\nThis patch
        introduces JSON schema validation for the share_networks\nremove_security_service
        action body. Since the action has no version\nrestriction, this applies to
        all microversions.\n\nIt validates security_service_id as a string. There
        is no UUID format\nrestriction, so unknown or non-UUID IDs still return a
        404, matching\nthe existing tempest negative tests\n(test_delete_nonexistant_sec_service_from_share_network).\n\nIt
        also adds response schemas for remove_security_service at all\nmicroversions
        (2.0+), reusing the share network response schemas\nadded in the update_security_service
        change.\n\n* Reworks test_action_remove_security_service to call the real\n
        \ method and view builder at each microversion, since it previously\n  mocked
        the method under test.\n* Updates the mocked views in the other remove tests
        to return a\n  complete share network, to match the new response schema.\n\nPartially-Implements:
        blueprint json-schema-validation\nChange-Id: I1ef888fcdc561a1f050aa603c7ae8ed348438218\nSigned-off-by:
        Folasade Falodun <falodunfolasade@gmail.com>\nAssisted-By: Claude Opus 5.5\n"
