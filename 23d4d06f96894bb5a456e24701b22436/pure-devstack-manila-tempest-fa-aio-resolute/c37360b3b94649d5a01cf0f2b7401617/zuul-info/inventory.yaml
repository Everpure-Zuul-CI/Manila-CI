      change: '1011232'
      change_message: "Validate share network update_security_service body\n\nThis
        patch introduces JSON schema validation for the share_networks\nupdate_security_service
        API (microversion 2.63+) to ensure\nvalidated request bodies in a new schemas/share_networks.py
        file.\n\nSpecifically, this patch:\n* Enforces UUID format for current_service_id
        and new_service_id.\n  Non-UUID values were already rejected with a 400 (as
        a missing\n  security service); they are now rejected earlier by the schema.\n*
        Follows the established house style for body schemas by setting\n  additionalProperties
        to False at the outer level, and True at\n  the inner level with a TODO note
        for future strictness.\n* The schema explicitly rejects extra top-level keys.
        The WSGI\n  action dispatcher already rejects these with a 400 (\"too many\n
        \ body keys\"), so there is no change in user-facing behavior.\n* Makes the
        manual KeyError handling in the controller unreachable\n  for missing keys.
        These checks can be safely removed in a\n  follow-up patch. The NotFound handling
        remains necessary.\n* Updates existing tests to pass the request body by keyword\n
        \ (body=body) since the validation decorator does not support\n  positional
        arguments.\n* Adds tests for invalid bodies (including non-UUIDs and missing\n
        \ keys) and verifies that extra inner keys are currently allowed.\n\nPartially-Implements:
        blueprint json-schema-validation\nChange-Id: Iee333ebc5bc47513090e5234ad7326dc6a1a6605\nSigned-off-by:
        Folasade Falodun <falodunfolasade@gmail.com>\n"
