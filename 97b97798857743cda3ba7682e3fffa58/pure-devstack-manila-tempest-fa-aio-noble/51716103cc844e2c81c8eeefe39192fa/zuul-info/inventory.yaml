      change: '1011481'
      change_message: 'Fix policy control for public shares


        A public share is visible to all tenants, but users other

        than the owner should not be able to modify it. Several

        operations skipped the ownership policy check for public

        shares. Also, the export location metadata endpoints

        resolved the export location globally, instead of within

        the share in the request URL.


        This commit enforces the ownership checks when

        manipulating access rules, creating backups or replicas,

        and soft deleting or restoring public shares. Export

        location metadata operations are now scoped to the share

        in the request URL; export locations that do not belong

        to that share now return 404.


        Change-Id: Ie283dce157f9c90f5d2ab38c1e74daa7df3ac118

        Signed-off-by: Carlos da Silva <ces.eduardo98@gmail.com>

        Closes-Bug: #2161412

        Closes-Bug: #2168962

        (cherry picked from commit d82acf175eec168cef5758632a84dbceac2ac341)

        (cherry picked from commit 4fbc4b4f3688e916428a7d95d10009d414e705ab)

        '
