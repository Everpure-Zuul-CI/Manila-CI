      change: '1011029'
      change_message: "Add schema validation for share access update\n\nThis patch
        introduces JSON schema validation for the share accesses\nupdate API (microversion
        2.88+) to ensure validated request bodies.\n\nSpecifically, this patch:\n*
        Follows the established house style for body schemas by setting\n  additionalProperties
        to False at the outer level, and True at the\n  inner level with a TODO note
        for future strictness.\n* Introduces a behavior change: extra top-level keys
        in the request\n  body are now rejected.\n* Makes the manual parameter checks
        in the update() method unreachable.\n  These can be safely removed in a follow-up
        patch.\n* Fixes the existing invalid-access-level test, which used the wrong\n
        \ body key and never actually exercised the access-level check. It is\n  now
        corrected and merged with other invalid-body cases into one\n  parametrised
        test.\n* Adds tests for a missing access_level, an extra top-level key\n  (rejected)
        and an extra key inside update_access (allowed).\n* Response body schema for
        update() is left for a follow-up patch to\n  keep this change focused.\n\nPartially-Implements:
        blueprint json-schema-validation\nChange-Id: Ica74f190ec1f1c08998405eafeb0e77daea74ea1\nSigned-off-by:
        Folasade Falodun <falodunfolasade@gmail.com>\n"
