      change: '1015333'
      change_message: 'Scope security service lookups to the project


        Adding a security service to a share network looked it up without

        project_only, so a project member who knew the ID of another

        project''s security service could associate it with their own share

        network and see its stored credentials in the detailed security

        service list. The update and update check actions looked up both the

        current and the new security service the same way.


        The fix for bug 1918323 scoped this lookup only in the add check

        action. Scope it in the add, update and update check actions too, so

        a security service from another project is treated the same as one

        that does not exist. No new error codes are introduced, so no

        microversion is needed.


        Closes-Bug: #2171016

        Assisted-By: Claude Opus 5.5

        Change-Id: Iadf94d9cff8f84f389592700b1745b45975f361c

        Signed-off-by: Ubah Delight Godson Okechukwu <delight.verse01@gmail.com>

        (cherry picked from commit 1c4ef5f21ac38b6885464a5ae8b8222b394773f7)

        '
