      buildset: 45d911cbca7a438f99a3ccd226b9d56d
      change: '1002969'
      change_message: "Add QoS support to the Everpure FlashArray driver\n\nLimits
        come from a Manila qos-type rather than from driver-specific\nshare type extra
        specs, so this follows the qos-types blueprint rather\nthan the older per-driver
        spec style, and the driver reports both \"qos\"\nand \"qos_type_support\".\n\nThe
        spec vocabulary is the one the NetApp cDOT driver established -\npolicy_type,
        max_throughput_iops, max_throughput_mbps - so a qos-type\nwritten for one
        backend means the same thing on the other.  A share\ntype names its qos-type
        through the default_qos_type extra spec; a\nshare whose type names none is
        created unthrottled, as before.\n\nWhat FlashArray cannot express is refused
        rather than dropped, because\na silently ignored throughput limit is worse
        than a refused share:\n\n* policy_type must be \"fixed\".  There is no adaptive
        form.\n* min_throughput_iops and min_throughput_mbps have no equivalent.  A\n
        \ FlashArray QoS policy is a ceiling; the array offers no guaranteed\n  floor.\n*
        An unrecognised spec is an error, so a typo cannot leave a share\n  quietly
        running without the limit that was asked for.\n* policy_type on its own, naming
        no limit, is an error too.\n\nEach share is given a policy of its own, named
        like its other policies,\nso a limit applies to that directory rather than
        being shared by every\nshare created from the same qos-type.\n\nThe result
        of attaching the policy is checked and the policy removed if\nthe attach fails,
        for the same reason the quota policy attach is\nchecked: an unattached policy
        leaves a share that works perfectly and\nignores its limit, which nothing
        downstream can detect.\n\nThis builds on the driver in review 795180 and is
        the child of it in the\nrelation chain, so the base driver can merge without
        waiting for QoS.\n\nChange-Id: Ie0a48b7385738808142688bd3556f00916ffb187\nAssisted-By:
        claude-code claude-opus-5\nSigned-off-by: Simon Dodsley <simon@purestorage.com>\n"
