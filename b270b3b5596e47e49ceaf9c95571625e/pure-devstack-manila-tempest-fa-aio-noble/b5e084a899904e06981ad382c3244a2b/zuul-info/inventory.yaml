      ansible_version: '8'
      attempts: 1
      branch: master
      build: b5e084a899904e06981ad382c3244a2b
      buildset: b270b3b5596e47e49ceaf9c95571625e
      change: '981706'
      change_message: 'Deferred delete share server and share network


        When share is deleted with ''deferred-deletion'' configured, its quota is

        released and share deletion is processed with state deferred_deleting.

        Anything goes wrong and share moves to error_deferred_deleting. The

        periodic function then cleanup those shares. Shares in these both states

        are hidden from non-admin user. So when user tries to delete share

        network assuming all shares are deleted, the share server deletion fails

        due to those hidden shares.


        To overcome, ''deferred-deletion'' feature is extended to share server and

        share network. When configured, share server deletion will move server

        to deferred_deleting state when all share instances on that share server

        are in deferred_deletion states. Similarly when share network is

        deleted, if all share instances are in deferred_deletion states, share

        server and hence share network cleanup will happen in deferred manner

        i.e. periodic callback. This means non-admin user will receive API

        response as share network is deleted, but network along-with its share

        servers are still present in db. Manila then internally run periodic

        function to cleanup those share servers and finally related share

        network. Any error in periodic callback processing will move share

        server and share network in ''error_deferred_deleting'' state and admin

        must cleanup those resources.


        Closes-bug: #2145137

        Change-Id: I3a502c3d7f88204cad9aa8525fe47d51a61a8de8

        Signed-off-by: Kiran Pawar <kinpaa@gmail.com>

        '
