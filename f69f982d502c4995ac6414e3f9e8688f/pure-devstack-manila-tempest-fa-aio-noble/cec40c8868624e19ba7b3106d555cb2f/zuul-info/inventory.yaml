      change: '989998'
      change_message: "Add Weka share driver\n\nAdds a Manila share driver for Weka
        storage, supporting two protocols:\n\n- WEKAFS: the WekaFS POSIX kernel client
        (sub-250 \xB5s latency, full POSIX\n  semantics, native quota enforcement).
        Requires the WekaFS kernel module\n  on the Manila host.\n- NFS: standard
        NFS v3 exports via Weka's built-in NFS gateway. Works on\n  all kernel versions
        with no additional client software.\n\nThe driver operates in DHSS=false mode.
        Weka filesystems are mapped\ndirectly to Manila shares. Supported operations
        include create/delete,\nextend/shrink, ensure, snapshots, revert-to-snapshot,\ncreate-from-snapshot,
        manage/unmanage, and capacity reporting.\n\nWEKAFS shares are isolated per
        tenant. Each Manila project is mapped to\nits own Weka organization, and WEKAFS
        filesystems are created with\nauthentication required inside that organization,
        so a mount token\nscoped to one project cannot mount another project's shares
        -- access is\nenforced at the Weka organization boundary. This requires a
        multi-tenant\nWeka cluster and the weka_org_admin_secret option, from which
        the\nper-organization credentials are derived; the driver refuses to start
        if\nit is unset. The per-project mount credential is returned to the tenant\nas
        each WEKAFS access rule's access_key for self-service, with no\noperator hand-off.\n\nWithin
        an organization, WEKAFS ip access rules are additionally enforced\nper share
        by the Weka cluster: each rule maps to a per-filesystem Weka\nsecurity policy
        that admits only the client source IPs it names, denying\nall others at native
        mount time. --access-level is honored (ro installs\na read-only policy); ip
        rules are IPv4-only. Alternatively, a share type\nmay reference a shared,
        reusable group policy via the\nweka:security_policy_group extra spec, defined
        by the\nweka_security_policy_group option.\n\nNFS shares use IP-based access
        rules.\n\nAlso adds WEKAFS to SUPPORTED_SHARE_PROTOCOLS in constants.py, RST
        admin\ndocumentation, and updates the share backends feature support mapping.\n\nImplements:
        blueprint weka-share-driver\nDepends-On: https://review.opendev.org/c/openstack/manila-tempest-plugin/+/999687\nSigned-off-by:
        Itai Weisman <itai.weisman@weka.io>\nChange-Id: Ic3f85449009b3a15a1219a01b8b4217132b41899\n"
      change_url: https://review.opendev.org/c/openstack/manila/+/989998
