      change_message: 'Fix share snapshot detail returning count below microversion
        2.79


        ShareSnapshotsController.detail does not drop the with_count query parameter
        for microversions earlier than 2.79, unlike the index method. This causes
        the detailed snapshot list to return count at those microversions.


        Added the same microversion check that index uses to strip with_count when
        the API version is below 2.79.


        Closes Bug: #2171620


