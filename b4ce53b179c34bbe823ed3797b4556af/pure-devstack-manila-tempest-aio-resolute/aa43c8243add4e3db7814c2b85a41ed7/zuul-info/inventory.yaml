        auto: true
        conf: true
        localrc: true
        log: true
        stackenv: true
        yaml: true
        yml: true
      external_bridge_mtu: 1500
      nodepool:
        az: nova
        cloud: kolla-admin
        external_id: 4849521d-7b97-4655-9c43-e853faaf81a1
        host_id: 99f8d44760dec060f0d7188c1d1c9cd2ee71502d28a8d7556a883647
