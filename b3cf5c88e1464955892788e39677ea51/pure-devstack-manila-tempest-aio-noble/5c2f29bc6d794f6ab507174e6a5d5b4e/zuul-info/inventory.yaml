      change: '997398'
      change_message: 'devstack: fix bash syntax error in array existence check


        The [[ -v VAR ]] syntax for checking if a variable is set requires

        bash 4.2+. bashate flags this as a syntax error (E040), causing

        tox -e pep8 to fail.


        Replace with the portable ${VAR+x} expansion which works in bash 3.x+

        and correctly tests whether the variable has been set.


        Closes-Bug: #2147282

        Change-Id: I35b7c31e1d75d90dde4264a7c03ee8ead2a49640

        Signed-off-by: Nathan Akin <solaakintewe@gmail.com>

        (cherry picked from commit 97ce0be8f78c55e8a354300df579f623c7efdd26)

