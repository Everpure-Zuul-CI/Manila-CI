      change: '1010069'
      change_message: 'api: Add schemas for share_groups


        Validate the create and update APIs of share groups,

        POST /v2/share-groups and PUT /v2/share-groups/{id}, with request

        body schemas and a response schema. The response schema covers the

        detail view at all microversions: availability_zone and

        consistent_snapshot_support (added in 2.34) and share_server_id

        (admin only) are allowed but not required. The decorators are

        attached to the experimental (2.31 to 2.54) and the graduated

        (2.55 and later) methods.


        Behaviour changes: an unknown field inside share_group on create is

        now rejected with a 400, where it was ignored before, and an

        invalid body is now rejected with a 400 before the policy check

        runs. The unit tests call create and update with body as a keyword.


        Implements: blueprint json-schema-validation

        Assisted-By: Claude <https://claude.ai>

        Depends-On: https://review.opendev.org/c/openstack/manila/+/1012052

        Change-Id: I85398165359f4afe986bbf2be77ba3e87db8211c

        Signed-off-by: Meer Hashaam Khan <hashaamkhan975@gmail.com>

        '
