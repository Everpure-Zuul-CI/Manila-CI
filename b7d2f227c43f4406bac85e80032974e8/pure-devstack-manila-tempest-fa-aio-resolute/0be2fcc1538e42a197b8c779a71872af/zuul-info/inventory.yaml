      change: '1010786'
      change_message: 'Add schema validation for update snapshot API


        Add request and response body schemas for the update snapshot API

        and apply them with the request_body_schema and response_body_schema

        decorators. Wrong types such as integers are now rejected by the

        request validator. Unknown keys are still allowed, so existing

        requests keep working.


        The response uses the same schemas as show for each microversion

        range, because update returns the same snapshot view.


        The validator reads the request body from kwargs, so the existing

        update tests now pass body as a keyword argument. The mocked

        snapshot_update returned a share instead of a snapshot, which fails

        response validation, so it now returns a snapshot. Add tests for a

        non-string display name, a null snapshot, a missing snapshot key and

        microversion 2.73.


        Signed-off-by: Faiqa Iqbal <faiqaiqbalc7@gmail.com>

        Change-Id: I40a054c3350f8ad245e90c23b726f33fc78f5a6f

