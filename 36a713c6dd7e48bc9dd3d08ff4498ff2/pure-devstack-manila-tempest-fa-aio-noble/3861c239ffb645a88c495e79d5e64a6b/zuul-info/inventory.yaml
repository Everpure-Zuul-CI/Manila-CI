      change: '983702'
      change_message: 'share: fix malformed log format string in restore_backup_continue


        The LOG.exception call in the restore_backup_continue error handler

        had %(share). instead of %(share)s., causing Python to raise a

        ValueError: incomplete format when a restore continuation failure

        occurred.


        This meant the except block itself would fail before the DB update

        calls could execute, leaving the share permanently stuck in

        STATUS_BACKUP_RESTORING and the backup stuck in STATUS_RESTORING.


        Closes-Bug: #2147529

        Change-Id: I51cca129e24fd2dc831d0ffacbde526e90da7a86

        Signed-off-by: Nathan Akin <solaakintewe@gmail.com>

        '
