      change: '1015348'
      change_message: 'Fix the response schema for export location metadata index


        Listing the metadata of a share export location was validated with the

        show metadata response schema, which requires a "meta" key. The index

        returns {"metadata": {...}}, so every response failed validation and

        the request returned a 400.


        Add a response schema for the index with the "metadata" shape and use

        it. The existing test_index_metadata test lists export locations rather

        than calling index_metadata, so add a test that calls it.


        Closes-Bug: #2174071

        Assisted-By: Claude Opus 5.5

        Change-Id: I4f65930700c1d653aa61350b59f6e264630ba21b

        Signed-off-by: Ubah Delight Godson Okechukwu <delight.verse01@gmail.com>

