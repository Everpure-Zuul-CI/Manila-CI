      build: 502760a06cd244c3afba141807b50231
      buildset: ee01c95fd22a4ad98ecb06d4203bafce
      change: '989424'
      change_message: "db purge: guard against purging un-deleted records with stale
        deleted_at\n\npurge_deleted_records only checked deleted_at when selecting
        rows to\npurge. Two issues resulted:\n\n1. Regular tables: on soft-delete
        the \"deleted\" column is set to the\n   record id. If a record is later un-deleted
        (deleted reset to\n   \"False\"/0) but deleted_at is intentionally left intact
        for audit\n   purposes, the next purge run would permanently delete it. Fix
        by\n   adding model.deleted == model.id to the filter so only genuinely\n
        \  soft-deleted rows are purged.\n\n2. Tables without an \"id\" column (async_operation_data,
        backend_info,\n   drivers_private_data): these tables set deleted=1 (not deleted=id)\n
        \  on soft-delete. Add a separate filter branch for these tables that\n   checks
        model.deleted == 1.\n\nCloses-bug: #2081827\nChange-Id: I5ccdf4fa03f3be36fca14dbd55a484135cbc3274\nCo-authored-by:
        Maurice Escher <maurice.escher@sap.com>\nSigned-off-by: Kiran Pawar <kinpaa@gmail.com>\n"
