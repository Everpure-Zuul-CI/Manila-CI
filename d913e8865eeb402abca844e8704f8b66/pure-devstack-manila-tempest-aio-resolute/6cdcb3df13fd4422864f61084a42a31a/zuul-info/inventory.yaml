      buildset: d913e8865eeb402abca844e8704f8b66
      change: '1008765'
      change_message: 'Add UniqueConstraint to ShareTypes model


        SQLite does not enforce the unique constraint on the ''name'' column

        for share types, which caused the unit test

        test_share_type_update_name_exist to fail. The DBDuplicateEntry

        exception was never triggered on SQLite.


        This change adds a UniqueConstraint on (name, deleted) to the

        ShareTypes model, consistent with the existing constraint on

        ShareGroupTypes. This ensures the database enforces name

        uniqueness across all backends.


        Closes-Bug: #1843498

        Change-Id: Iad4eaf365ef695cb32594041ffe5c08d6375c187

        Signed-off-by: sakumbha <sakumbha@redhat.com>

