      change: '1011853'
      change_message: "Validate remove security service action body\n\nThis patch
        introduces JSON schema validation for the share_networks\nremove_security_service
        action body. Since the action has no version\nrestriction, this applies to
        all microversions.\n\nSpecifically, this patch:\n* Enforces UUID format for
        security_service_id. A non-UUID previously\n  returned a 404 (security service
        not found) but now returns a 400\n  from the schema. An unknown but valid
        UUID still gets a 404, and an\n  unlinked one still gets a 400.\n* Follows
        the established house style for body schemas by setting\n  additionalProperties
        to False at the outer level, and True at the\n  inner level with a TODO note
        for future strictness.\n* Explicitly rejects extra top-level keys. The WSGI
        action dispatcher\n  already rejected these, so there is no user-facing behavior
        change.\n* Makes the controller's `except KeyError` for a missing\n  security_service_id
        unreachable. This can be removed in a follow-up.\n* Updates existing tests
        to pass the request body by keyword\n  (body=body) and to use valid UUIDs.\n*
        Adds tests for invalid bodies at microversion 2.0 (missing keys,\n  wrong
        types, non-UUIDs, extra top-level keys) and verifies that an\n  extra inner
        key is allowed.\n\nPartially-Implements: blueprint json-schema-validation\nChange-Id:
        I1ef888fcdc561a1f050aa603c7ae8ed348438218\nSigned-off-by: Folasade Falodun
        <falodunfolasade@gmail.com>\n"
