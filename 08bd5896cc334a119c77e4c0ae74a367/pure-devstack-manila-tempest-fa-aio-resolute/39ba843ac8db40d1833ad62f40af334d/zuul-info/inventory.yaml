      build: 39ba843ac8db40d1833ad62f40af334d
      buildset: 08bd5896cc334a119c77e4c0ae74a367
      change: '1011575'
      change_message: 'Add JSON schemas for share transfer create


        Replace the manual request body checks in

        ShareTransferController.create() with a JSON Schema registered via

        validation.request_body_schema, and validate the response with

        validation.response_body_schema.


        The request schema requires a "transfer" object containing

        "share_id", a string in UUID format, which is checked with

        is_uuid_like as before. "name" is optional and may be null or a

        string of at most 255 characters, matching the display_name column.

        Unknown properties are still accepted, preserving the existing

        behavior.


        Previously, a non-string name such as 123 reached name.strip() and

        raised AttributeError, returning a 500 error. It is now rejected with

        a 400 error.


        The response schema describes the transfer returned by create,

        including the auth_key that only the create response contains.


        Update the create tests to pass the body by keyword, as the

        validation decorator requires, and add cases for invalid bodies and

        for optional fields that must still be accepted.


        Change-Id: Id666017579883fa0259b9fa92c16dc94f760badb

        Signed-off-by: Ubah Delight Godson Okechukwu <delight.verse01@gmail.com>

        '
