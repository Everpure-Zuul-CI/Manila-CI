      buildset: 1cb540302c17467f8c87b4d5e51ed5e0
      change: '1010888'
      change_message: "Fix shallow copy bug in share snapshots schema\n\nThe versioned
        list-snapshot query schemas in the share_snapshots\nmodule previously used
        copy.copy() (a shallow copy), so every\nversion shared the same nested 'properties'
        dict. Calling .update()\non a newer version schema therefore also modified
        the base schema.\n\nAs a result, older microversions were inaccurately described
        as\naccepting parameters they did not actually support (e.g., name~,\ndescription~,
        metadata, and with_count).\n\nThis patch:\n* Replaces copy.copy() with copy.deepcopy()
        in the versioned\n  schema definitions to properly isolate them.\n* Adds a
        unit test to ensure the versioned schemas do not pollute\n  the base schema.\n*
        Adds behavior tests to verify that with_count validation is\n  correctly enforced
        at microversion 2.79, and not validated at\n  2.0, where with_count is not
        part of the schema.\n* Added a release note.\n\nCloses-Bug: #2171025\nChange-Id:
        Ia70566ee15305c0e5ffd1b39a239c1252a38f2fe\nAssisted-By: Claude Opus 5.5\nSigned-off-by:
        Folasade Falodun <falodunfolasade@gmail.com>\n"
