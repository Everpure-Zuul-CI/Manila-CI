      change_message: 'api: Add schemas for share_replicas


        Validate the create API of share replicas,

        POST /v2/share-replicas, with the existing request body schema and

        a response schema for the share replica detail view. The response

        allows the admin-only fields (share_server_id, host,

        cast_rules_to_readonly) and the 2.95 metadata field without

        requiring them. The decorators are attached to all four create

        methods (experimental 2.11 to 2.55, graduated 2.56 to 2.66,

        2.67 to 2.94 with scheduler_hints, and 2.95 with metadata).


        Behaviour change: a missing share_replica key in the request body

        is now rejected with a 400 before the policy check runs. The unit

        tests call create with body as a keyword.


        Implements: blueprint json-schema-validation

        Assisted-By: Claude <https://claude.ai>

        Depends-On: https://review.opendev.org/c/openstack/manila/+/1012052

