      branch: master
      build: 80d24653cdb245f2873043351c226760
      buildset: 0778abce9a044b2e90b27f770960e25b
      change: '1006929'
      change_message: 'NetApp: retry locked CG snapshot deletion


        When a share group snapshot is used to create share groups, ONTAP can

        briefly keep the consistency group snapshot locked after the clone

        volumes are removed. The REST delete then fails with error 53412007

        ("Failed to delete snapshot ... because it has not expired or is

        locked") and the share group snapshot is left behind, which in turn

        makes subsequent share group deletions fail with "Cannot delete a share

        group with snapshots".


        Retry the consistency group snapshot deletion while ONTAP reports the

        snapshot as locked, up to the configured async REST timeout. Deletion of

        an already removed snapshot is still treated as success and any other

        error keeps failing immediately.


        Change-Id: Ic8fb2634ab2cdcf3ee4f8a2a034aefa89d5a0107

        Signed-off-by: Medha Choudhary <medhac@netapp.com>

        '
