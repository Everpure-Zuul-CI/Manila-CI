      change: '1011075'
      change_message: 'Add JSONSchema validation: shares.access_list_legacy() [v2.0-2.6]


        This patch adds request-body and response-body validation to

        shares.access_list_legacy() for API microversions 2.0 through 2.6.


        The request schema requires the os-access_list envelope while leaving

        its ignored value unrestricted, matching existing accepted requests.

        Action dispatch already rejects missing or extra envelope keys.


        The response schema requires an access_list array whose items contain

        id, access_level, access_type, access_to and state. It validates UUIDs

        and access levels and restricts legacy states to new, active and error.

        The schema permits empty lists and rejects additional response fields.


        The controller tests cover accepted and invalid request bodies and

        malformed responses. The helper test verifies service lookups and

        arguments to the view builder. The HTTP tests cover the action-name

        transition at microversion 2.7 and verify legacy state translation

        using database records and the real view builder.


        Change-Id: I0d055a626a3a80339b266bb9ede62f6d8ab458f1

        Signed-off-by: Fiyin Peter <insitupeter@gmail.com>

        '
