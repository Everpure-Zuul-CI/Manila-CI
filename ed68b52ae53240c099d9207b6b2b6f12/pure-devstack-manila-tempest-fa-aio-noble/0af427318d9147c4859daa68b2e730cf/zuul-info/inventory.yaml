      branch: master
      build: 0af427318d9147c4859daa68b2e730cf
      buildset: ed68b52ae53240c099d9207b6b2b6f12
      change: '998748'
      change_message: 'Fix share type filtering by multiple extra specs


        In _check_extra_specs_match(), the "return True" was inside the loop

        that iterates over the requested extra specs, so the helper returned as

        soon as the first spec matched. Share types that did not satisfy the

        remaining specs were reported as matches. Since the outcome depended on

        the iteration order of the filter dict, the same filter could return

        different results depending on the order the extra specs were written

        in the query string.


        This was introduced by 4249e94c6, which de-indented the helper by one

        level but left the "return True" line at its original indentation. Move

        it back out of the loop so that every requested extra spec is checked.


        Also add a unit test that filters on multiple extra specs, covering a

        mismatching value and an absent key in both key orders. The existing

        test only ever passed a single extra spec, which is why the regression

        went unnoticed.


        Closes-Bug: #2161862

        Assisted-By: Claude Code (claude-opus-5)

        Change-Id: I0c7699b48703136edd2bf09dab7bbfd077aa0122

        Signed-off-by: HyungJoon Kim <hjoon87.kim@samsung.com>

        '
