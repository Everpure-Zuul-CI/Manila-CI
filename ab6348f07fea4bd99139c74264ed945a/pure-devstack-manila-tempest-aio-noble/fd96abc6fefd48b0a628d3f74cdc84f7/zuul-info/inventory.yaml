      change: '963494'
      change_message: 'VAST driver: Add VIP pool extra specs and list pagination


        This patch adds multitenancy support to the VAST Manila driver by

        allowing administrators to specify different VIP pools per share type

        using the namespaced extra spec ''vast:vippool_name''. This enables

        network isolation between different tenants or projects while sharing

        the same Manila backend.


        It also adds support for paginated VMS list responses via

        ResourceIterator, which follows ''next'' page links until all results

        are retrieved while remaining compatible with non-paginated responses.


        Change-Id: If01c9fd888b4338a7ac5408f6a589e9bbeae8903

        Signed-off-by: Volodymyr Boiko <volodymyr.boiko@vastdata.com>

