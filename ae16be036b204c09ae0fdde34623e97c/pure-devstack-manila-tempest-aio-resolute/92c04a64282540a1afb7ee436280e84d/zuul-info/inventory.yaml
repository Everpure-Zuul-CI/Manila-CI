      build: 92c04a64282540a1afb7ee436280e84d
      buildset: ae16be036b204c09ae0fdde34623e97c
      change: '1013354'
      change_message: '[Everpure] FlashBlade: port to py-pure-client (REST API 2.x)


        The FlashBlade driver used the purity_fb SDK and FlashBlade REST API

        1.x, which are no longer developed. Move it to py-pure-client and REST

        API 2.x with the same share, snapshot and access-rule behaviour and

        naming. The minimum supported FlashBlade software is now Purity//FB

        4.3.0 (REST API 2.11), checked at setup.


        Array errors are ErrorResponse objects handled in one place and

        reported with the array''s message; transport failures are mapped to

        ShareBackendException; the SDK re-authenticates after a lost session,

        so the re-login logic from bug 2032681 is gone. A CA bundle given by

        flashblade_ca_cert_path is passed through the SDK''s Configuration

        object, as the factory''s ssl_cert argument is not honoured. Deleting a

        share or snapshot that is missing or already destroyed on the array

        now succeeds, and the provisioned capacity reported to the scheduler

        is the sum of the file systems'' provisioned sizes rather than unique

        physical usage.


        The driver is fully type-annotated and passes mypy in cinder''s

        configuration and in strict mode, with and without py-pure-client

        installed. The unit tests use fakes that record and compare request

        model arguments instead of module mocks, plus contract tests that

        check the fakes against the real SDK when it is installed.


        Assisted-By: Claude Code <claude-fable-5-1>

        Change-Id: Ieba4a862efda2f7baa33d9950416ce39622f15c2

        Signed-off-by: Simon Dodsley <simon@purestorage.com>

        '
