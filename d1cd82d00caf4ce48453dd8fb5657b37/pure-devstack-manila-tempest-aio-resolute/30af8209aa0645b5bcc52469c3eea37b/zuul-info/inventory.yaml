      buildset: d1cd82d00caf4ce48453dd8fb5657b37
      change: '1014296'
      change_message: 'Add OpenTelemetry tracing middleware for Manila


        Wire the OpenTelemetry tracing middleware provided by oslo.middleware

        into the Manila API paste pipeline.


        The paste filter can be added unconditionally: the middleware is

        disabled by default and acts as a zero-overhead passthrough when off, so

        the optional opentelemetry libraries do not need to be installed just to

        have the filter present. Enabling tracing requires extra configuration:

        set "enabled = True" under the [oslo_middleware_tracing] group in

        manila.conf and install the optional opentelemetry packages. Enabling

        the middleware without those packages installed will cause the service

        to fail at startup.


        The TracingMiddleware is only available from oslo.middleware 8.2.0

        onwards, so the minimum required version is bumped accordingly.


        Add a new non-voting manila-tempest-tracing job, based on

        manila-tempest-plugin-dummy-no-dhss, that enables tracing using

        devstack-plugin-jaeger and verifies after the run that the manila-api

        traces were stored in Jaeger.


        Assisted-By: Claude Opus 5.5

        Change-Id: I7275402b2a348932bb97b93df295d754187441f9

        Signed-off-by: Juan Larriba <jlarriba@redhat.com>

        '
