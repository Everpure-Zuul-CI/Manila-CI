      ansible_version: '8'
      attempts: 1
      branch: stable/2026.1
      build: 07f50a8eec3a498ba033d676cc45cf96
      buildset: 037a3ded06544106abdb24d95334ec0f
      change: '1006356'
      change_message: 'db: Add missing raise for exception.NotFound()


        Three functions in manila/db/sqlalchemy/api.py instantiate

        exception.NotFound() without the raise keyword, so the exception object

        is discarded and execution falls through to code that dereferences the

        object that was just found to be None. The "if not <obj>:" guard is

        therefore dead code, and a TypeError or AttributeError is raised from

        the following statement instead of NotFound.


        Affected functions:

        * share_instance_access_delete()

        * _share_snapshot_instance_access_delete()

        * _share_snapshot_instance_export_location_delete()


        This change adds the missing raise keyword in all three places.


        Also add unit tests that pass a non-existent id to each of the three

        code paths and assert that NotFound is raised. Without the fix they

        fail with TypeError or AttributeError, as described above.

        share_snapshot_instance_export_location_delete() had no coverage at

        all, so a test for its success path is added as well.


        Closes-Bug: #2161859

        Change-Id: Ifcf74654ef5a07751f7b12796e8475fa728360f1

        Signed-off-by: HyungJoon Kim <hjoon87.kim@samsung.com>

        (cherry picked from commit 6c59ba474a08700f8cdaeb234d18dea3881a3fe3)

        '
