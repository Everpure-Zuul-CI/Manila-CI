      change: '1001006'
      change_message: '[NetApp] Store share server details if failign to reach Barbican


        In case _create_barbican_kms_config_for_specified_vserver fails,

        the NetApp ONTAP driver fails to store the share server details,

        making it impossible to manually delete the share server

        afterwards, considering that the deletion process requires the

        vserver name mandatory to succeed.


        This fix follows the same approach as the setup vserver proccess

        does: in case of an exception, we save the share server data in

        a format that Manila is already expecting, so the share/manager

        will be able to save the share server details and the NetApp

        ONTAP driver will be able to locate the share server for deletion

        later.


        Closes-Bug: #2163166

        Change-Id: Icb915624dfa3ec50d1973edaa90aec62c0ec1f52

        Signed-off-by: Carlos da Silva <ces.eduardo98@gmail.com>

        (cherry picked from commit 93b437f345ef15b0305091765db62c75f2e21635)

        '
