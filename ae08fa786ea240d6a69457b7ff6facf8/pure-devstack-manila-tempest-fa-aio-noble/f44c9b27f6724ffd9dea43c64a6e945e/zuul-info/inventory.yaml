      change: '1002585'
      change_message: "NetApp: Fix SVM DR share server migration for REST client\n\nFix
        the SVM DR migration-complete sequence for the REST client:\n\n- Reorder cutover
        steps: set up destination networking before the\n  SnapMirror break (ONTAP
        REST requires a LIF on the destination\n  SVM before break succeeds, error
        13303857), and stop the source\n  SVM and wait for it to be operationally
        stopped before break\n  (ONTAP may reject break if the partner SVM is still
        up, 2621636).\n- Handle idempotent retries: ignore error 18815/18813 on the\n
        \ pre-break SnapMirror update when the relationship is already\n  quiesced,
        and ignore 2621636 on destination start when the SVM\n  is already running.\n-
        Fix autosize unit conversion to skip the KiB-to-bytes multiply\n  when using
        the REST client (REST already returns bytes).\n- Add explicit SVM-level SnapMirror
        methods to the REST client\n  (create, initialize, break, delete, quiesce)
        so they no longer\n  fall back to ZAPI via __getattr__.\n- Fix _create_vserver
        to omit aggregates and space settings for\n  dp_destination SVMs (ONTAP rejects
        them) and skip the\n  retention-period patch (also rejected for this subtype).\n-
        Fix get_vserver_info to map the single REST 'state' field to\n  'operational_state'
        and hard-code 'state' as 'running', matching\n  the ZAPI semantics that wait_for_vserver_state
        relies on.\n- Fix create_snapmirror_policy to use 'identity_preservation'
        and\n  'copy_all_source_snapshots' instead of the incorrect field names.\n-
        Fix _delete_snapmirror and _create_snapmirror to handle None\n  volume arguments
        for SVM-level relationships.\n- Refresh backend_details for the destination
        share server in\n  share_server_migration_start to ensure vserver_name is
        present.\n\nChange-Id: I3662b1abc3d637c97ecf7a503dc0b10b2e8d3a9d\nSigned-off-by:
        Medha Choudhary <medhac@netapp.com>\n"
