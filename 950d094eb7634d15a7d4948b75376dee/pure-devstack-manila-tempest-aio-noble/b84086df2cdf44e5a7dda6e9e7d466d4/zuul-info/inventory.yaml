      change_message: 'NetApp: Fix KeyError ''nas'' in REST get_volume_junction_path


        Fixes a KeyError: ''nas'' in the NetApp REST driver when reading a

        volume''s junction path. The ONTAP collection GET on /storage/volumes

        sometimes returns the matching record without the nas field. Switching

        to an instance GET by UUID returns nas.path reliably. Most commonly hit

        during driver-assisted share server migration.


        Assisted-By: Claude Code Opus 4.7

        Assisted-By: Claude Sonnet 4.6


        Closes-Bug: #2157989

        Change-Id: I40208668437b757b3e7e73ff8f0771da6bbb9613

