      change: '974649'
      change_message: 'api: Add Schema to share: create POST /v2/share


        Add JSON schemas to validate the request and response bodies of

        POST /v2/shares for every microversion.


        Request: size and share_proto are required. size accepts a positive

        integer or digit string. name and description are limited to 255

        characters, matching the database columns. share_group_id (2.31),

        scheduler_hints (2.65), mount_point_name (2.84) and

        encryption_key_ref (2.90) are added by microversion.


        Response: the schema now follows what the view builder returns,

        including share_type and share_type_name (2.6), the removal of

        export_location(s) (2.9), and new fields up to 2.99. host and

        share_server_id are optional because only host admins get them.


        Invalid names or descriptions now raise ValidationError (HTTP 400)

        before the policy check runs.


        Change-Id: I2de95b912e941646f12d616ffca92b1721369055

        Signed-off-by: JonathanKoerber <jonathankoerber@gmail.com>

        Co-Authored-By: Namrata Thakur <tnamrata137@gmail.com>

        '
