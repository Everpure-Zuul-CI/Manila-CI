      change: '1011253'
      change_message: "Validate check update security service body\n\nThis patch introduces
        JSON schema validation for the share_networks\ncheck_update_security_service
        API (microversion 2.63+) to\nvalidate request and response bodies.\n\nSpecifically,
        this patch:\n* Builds upon the update_security_service schema using a deep
        copy,\n  renaming the outer key to 'update_security_service_check', and\n
        \ adding the optional 'reset_operation' boolean field.\n* Restricts 'reset_operation'
        to the parameter_types.boolean enum.\n  Previously, this was parsed by get_bool_from_api_params.
        Invalid\n  values still return a 400, but some previously accepted edge cases\n
        \ are now rejected early by the schema.\n* Enforces UUID format for current_service_id
        and new_service_id.\n  Non-UUID values were already rejected with a 400; they
        are now\n  rejected earlier by the schema.\n* Follows the established house
        style for body schemas by setting\n  additionalProperties to False at the
        outer level, and True at\n  the inner level with a TODO note for future strictness.\n*
        The schema explicitly rejects extra top-level keys. The WSGI\n  action dispatcher
        already rejects these with a 400, so there is\n  no change in user-facing
        behavior.\n* Makes the manual KeyError handling in the controller unreachable\n
        \ for missing keys. These checks can be safely removed in a\n  follow-up patch.
        The NotFound handling remains necessary.\n* Updates existing tests to pass
        the request body by keyword\n  (body=body) since the validation decorator
        does not support\n  positional arguments.\n* Adds tests for invalid bodies
        (including non-UUIDs and bad\n  reset_operation values) and verifies that
        extra inner keys\n  are currently allowed.\n* Adds a response schema for check_update_security_service
        (2.63+).\n  'compatible' may be null while backend hosts are still being\n
        \ checked, and 'hosts_check_result' is only returned to admins, so\n  it is
        not required.\n* Updates the mocked view in the check_update tests to return
        a\n  complete response, to match the new response schema.\n\nPartially-Implements:
        blueprint json-schema-validation\nChange-Id: Id7ceb396c503caf0f7766e369b206b4710761966\nSigned-off-by:
        Folasade Falodun <falodunfolasade@gmail.com>\nAssisted-By: Claude Opus 5.5\n"
      change_url: https://review.opendev.org/c/openstack/manila/+/1011253
