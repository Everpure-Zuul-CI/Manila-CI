      change: '994884'
      change_message: "NetApp ONTAP: REST-based CG snapshot lifecycle for share groups\n\nImplement
        full consistency group (CG) snapshot support over the ONTAP\nREST API for
        share groups on ONTAP >= 9.11.1:\n\n- create_cgsnapshot: lazily creates a
        persistent CG on first snapshot,\n  reuses it on subsequent snapshots (PATCH
        to add new members), takes a\n  crash-consistent CG-level snapshot and stores
        the UUID in\n  private_storage.\n- delete_cgsnapshot: deletes the CG snapshot
        by UUID via REST, cleans\n  up private_storage; falls back to per-volume soft-delete
        for snapshots\n  created before this patch (backward-compatible).\n- delete_share_group:
        removes the ONTAP CG object when the Manila share\n  group is deleted (previously
        the CG leaked on ONTAP).\n- Clone workflow: creates a new persistent CG for
        the cloned share group.\n- _get_cg_client: routes CG REST calls to a REST
        client even when\n  netapp_use_legacy_client = True (auto-creates a cached
        REST client when\n  ONTAP >= 9.11.1 is detected).\n\nAlso fixes AttributeError
        in soft_delete_snapshot and\nrename_snapshot_and_split_clones where netapp_api.NaApiError
        was\nreferenced incorrectly (correct: netapp_api.api.NaApiError).\n\nChange-Id:
        I119377268a14985a989a4e6c8cc77138e957da2b\nSigned-off-by: Medha Choudhary
        <medhac@netapp.com>\n"
