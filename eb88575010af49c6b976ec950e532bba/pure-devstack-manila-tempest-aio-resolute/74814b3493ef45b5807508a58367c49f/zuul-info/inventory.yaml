      change: '1015322'
      change_message: 'Check share access before access rule locks in deny_access


        The deny_access action checked the access rule''s locks before checking

        that the caller can access the share and the access rule. The lock

        check searches all projects, so a caller who knows another project''s

        access rule ID could tell from the error whether that rule exists and

        has a delete lock.


        Check the locks only after the share lookup and the check that the

        rule belongs to the share, so other projects get the same 404 whether

        or not the rule is locked. The behavior for the share''s owner doesn''t

        change.


        Closes-Bug: #2174012

        Assisted-By: Claude Opus 5.5

        Change-Id: I4900a528c99a655e013a2ff0c23032aef403b3a5

        Signed-off-by: Ubah Delight Godson Okechukwu <delight.verse01@gmail.com>

        '
