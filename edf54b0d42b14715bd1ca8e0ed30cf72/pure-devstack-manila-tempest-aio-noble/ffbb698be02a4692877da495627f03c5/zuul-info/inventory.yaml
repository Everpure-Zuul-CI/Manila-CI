      build: ffbb698be02a4692877da495627f03c5
      buildset: edf54b0d42b14715bd1ca8e0ed30cf72
      change: '992247'
      change_message: 'NetApp: ensure_shares applies QoS type policy on service restart


        update_share (called by ensure_shares) only handled share-type

        extra-spec QoS. When a share has a qos_type_id set, the QoS type

        policy was not applied or reconciled on service restart.


        Add QoS type handling to update_share following the same mutual

        exclusivity as create_share: if qos_type_specs are present, call

        _create_qos_type_policy_group (idempotent modify-or-create) and set

        qos_policy_group (fixed) or adaptive_qos_policy_group (adaptive) in

        provisioning_options; otherwise fall through to the existing

        _modify_or_create_qos_for_existing_share path


        Related-Bug: #2114885

        Change-Id: I6855a87d37c06434edbe3d6e18bb9039c1e0bc33

        Signed-off-by: Kiran Pawar <kinpaa@gmail.com>

        Assisted by Claude for Mock tests

        '
